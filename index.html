<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Vector Sunflower</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #1e1e24 0%, #0d0d11 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* SVG Vector Animation Keyframes */
        .stem-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: growStem 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes growStem {
            to {
                stroke-dashoffset: 0;
            }
        }

        .leaf-left {
            transform-origin: 200px 330px;
            transform: scale(0) rotate(-30deg);
            animation: popLeafLeft 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards;
        }

        .leaf-right {
            transform-origin: 200px 300px;
            transform: scale(0) rotate(30deg);
            animation: popLeafRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.4s forwards;
        }

        @keyframes popLeafLeft {
            to {
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes popLeafRight {
            to {
                transform: scale(1) rotate(0deg);
            }
        }

        .flower-head {
            transform-origin: 200px 180px;
            transform: scale(0) rotate(-45deg);
            animation: bloomFlower 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards;
        }

        @keyframes bloomFlower {
            to {
                transform: scale(1) rotate(0deg);
            }
        }

        .sway-wrapper {
            transform-origin: 200px 420px;
            animation: gentleSway 4.5s ease-in-out infinite alternate 3.2s;
        }

        @keyframes gentleSway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(-2deg); }
        }

        @keyframes gentleSway {
            0% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(2.5deg);
            }
            100% {
                transform: rotate(-2.5deg);
            }
        }

        /* Floating elements animations */
        .float-heart {
            animation: floatUpHeart 4s ease-in-out infinite alternate;
        }

        @keyframes floatUpHeart {
            0% { transform: translateY(0px) scale(0.9) rotate(-5deg); }
            100% { transform: translateY(-15px) scale(1.1) rotate(5deg); }
        }

        .float-item-1 { animation: floatAnim1 4.5s ease-in-out infinite alternate; }
        .float-item-2 { animation: floatAnim2 5.2s ease-in-out infinite alternate 0.4s; }
        .float-item-3 { animation: floatAnim3 4.8s ease-in-out infinite alternate 0.8s; }
        .float-item-4 { animation: floatAnim1 5.5s ease-in-out infinite alternate 1.2s; }
        .float-item-5 { animation: floatAnim2 4.2s ease-in-out infinite alternate 1.6s; }

        @keyframes floatAnim1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-10px, -14px) rotate(15deg); }
        }

        @keyframes floatAnim2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(12px, -12px) rotate(-15deg); }
        }

        @keyframes floatAnim3 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-8px, 10px) rotate(10deg); }
        }

        /* Replay Button Styling */
        .replay-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .replay-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.4);
        }
        .replay-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Sparkle Particle Canvas */
        #sparkleCanvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Floating Click Word Particle */
        .click-word {
            position: absolute;
            pointer-events: none;
            font-family: 'Fredoka', cursive, sans-serif;
            font-weight: 600;
            color: #d97706;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.6);
            white-space: nowrap;
            z-index: 25;
            animation: floatUpWord 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatUpWord {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6) rotate(-4deg);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -20px) scale(1.1) rotate(2deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -75px) scale(0.9) rotate(-3deg);
            }
        }
    </style>
</head>
<body class="p-4 sm:p-6">

        <!-- Controls / Replay Floating Bar -->
        <div class="absolute bottom-6 z-20">
            <button id="replayBtn" class="replay-btn bg-amber-500 hover:bg-amber-600 text-white font-semibold px-6 py-2.5 rounded-full shadow-lg flex items-center gap-2 text-sm">

    <script>
        // Sparkle Particles Interactive Canvas Engine
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // List of cute phrases for click interaction (Correct Spelling)
        const romanticPhrases = [
            "I love you",
            "I like you",
            "I adore you",
            "You are my sunshine",
            "You are amazing",
            "Forever & Always",
            "My favorite person"
        ];
        let phraseIndex = 0;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, isHeart = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.isHeart = isHeart;
                this.size = isHeart ? Math.random() * 12 + 10 : Math.random() * 4 + 1.5;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = isHeart ? -(Math.random() * 1.8 + 1) : (Math.random() - 0.5) * 2 - 0.5;
                this.color = `hsl(${42 + Math.random() * 15}, 100%, ${55 + Math.random() * 30}%)`;
                this.alpha = 1;
                this.life = isHeart ? Math.random() * 45 + 35 : Math.random() * 60 + 40;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 1 / this.life;
                if (!this.isHeart && this.size > 0.2) this.size -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.isHeart) {
                    ctx.font = `${this.size}px 'Fredoka', sans-serif`;
                    ctx.fillStyle = "#fbbf24";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#f59e0b";
                    ctx.fillText("♥", this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function createBurst(x, y, amount = 15) {
            for (let i = 0; i < amount; i++) {
                particles.push(new Particle(x, y, false));
            }
            // Spawn yellow heart particles
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, true));
            }
        }

        function spawnFloatingWord(x, y) {
            const container = document.getElementById('cardContainer');
            const wordEl = document.createElement('div');
            wordEl.className = 'click-word';
            wordEl.style.left = `${x}px`;
            wordEl.style.top = `${y}px`;
            wordEl.textContent = romanticPhrases[phraseIndex];
            
            // Cycle through phrases
            phraseIndex = (phraseIndex + 1) % romanticPhrases.length;

            container.appendChild(wordEl);
            setTimeout(() => {
                wordEl.remove();
            }, 1600);
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0 || (particles[i].size <= 0.2 && !particles[i].isHeart)) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Reveal Floating Elements on Grow Finish
        setTimeout(() => {
            document.getElementById('titleText').classList.remove('opacity-0');
            document.querySelectorAll('.float-decor').forEach(el => el.classList.remove('opacity-0'));
            
            // Burst sparkles around flower head
            const rect = canvas.getBoundingClientRect();
            createBurst(rect.width / 2, rect.height * 0.4, 30);
        }, 2200);

        // Click Interactive Sparkles & Dynamic Words
        document.getElementById('cardContainer').addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            createBurst(x, y, 18);
            spawnFloatingWord(x, y);
        });

        // Replay Animation Logic
        document.getElementById('replayBtn').addEventListener('click', (e) => {
            e.stopPropagation(); // prevent triggering canvas click word on button click
            const svg = document.getElementById('sunflowerSvg');
            const title = document.getElementById('titleText');

            // Hide floating elements
            title.classList.add('opacity-0');
            document.querySelectorAll('.float-decor').forEach(el => el.classList.add('opacity-0'));

            // Reset SVG Animation
            const clone = svg.cloneNode(true);
            svg.parentNode.replaceChild(clone, svg);

            // Trigger particles & show elements again
            setTimeout(() => {
                title.classList.remove('opacity-0');
                document.querySelectorAll('.float-decor').forEach(el => el.classList.remove('opacity-0'));
                const rect = canvas.getBoundingClientRect();
                createBurst(rect.width / 2, rect.height * 0.4, 35);
            }, 2200);
        });
    </script>
</body>
</html>
